<h1>{{ post[1] }}</h1>

<p>{{ post[2] }}</p>
<p>By {{ post[3] }} | ❤️ {{ post[4] }}</p>

<!-- IMAGE POST -->
{% if post[5] %}
    <img src="/{{ post[5] }}" width="300">
{% endif %}

<hr>

<h3>Comments</h3>

{% for c in comments %}
    <p><b>{{c[2]}}</b>: {{c[3]}}</p>
{% endfor %}

<hr>

<form method="post">
    <textarea name="content" placeholder="Write comment..." required></textarea>
    <button>Comment</button>
</form>
