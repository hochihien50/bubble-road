<h1>Profile: {{ user }}</h1>

{% if data[2] %}
    <img src="{{ data[2] }}" width="120" style="border-radius:50%">
{% else %}
    <p>No avatar</p>
{% endif %}

<hr>

<p>XP: {{ data[0] }}</p>
<p>Level: {{ data[1] }}</p>

<hr>

<h3>Change Avatar</h3>

<form method="post" action="/upload_avatar" enctype="multipart/form-data">
    <input type="file" name="avatar" required>
    <button>Upload</button>
</form>
