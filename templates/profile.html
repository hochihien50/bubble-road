<h1>Profile: {{ user }}</h1>

<a href="/">Home</a> |
<a href="/leaderboard">Leaderboard</a> |
<a href="/logout">Logout</a>

<hr>

<!-- AVATAR -->
{% if data[2] %}
    <img src="{{ data[2] }}"
         width="120"
         style="border:1px solid black;padding:3px;">
{% else %}
    <p>No avatar</p>
{% endif %}

<p>XP: {{ data[0] }}</p>
<p>Level: {{ data[1] }}</p>

<hr>

<!-- UPLOAD AVATAR -->
<form method="post"
      action="/upload_avatar"
      enctype="multipart/form-data">

    <input type="file" name="avatar" required>
    <button>Upload Avatar</button>

</form>

<hr>

<!-- 🔥 NEW: ACTIVITY POSTS -->
<h2>📝 Posts Activity</h2>

{% if posts %}
    {% for p in posts %}
        <div style="border:1px solid #ddd; padding:10px; margin-bottom:10px">

            <h3>
                <a href="/post/{{ p[0] }}">
                    {{ p[1] }}
                </a>
            </h3>

            <p>{{ p[2] }}</p>

            <small>❤️ {{ p[3] }} likes</small>

        </div>
    {% endfor %}
{% else %}
    <p>No posts yet 😢</p>
{% endif %}
