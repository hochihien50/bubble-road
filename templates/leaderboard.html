<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
</head>
<body>

<h1>🏆 Top XP</h1>

<a href="/">🏠 Home</a>

{% for u in users %}

</div>

{% endfor %}

</body>
</html>
